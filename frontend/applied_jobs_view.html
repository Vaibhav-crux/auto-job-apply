<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applied Jobs Viewer</title>
    <link rel="stylesheet" href="applied_jobs_view.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">💼</span>
                <h1>Applied Jobs</h1>
            </div>
            <div class="search-container">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input type="text" id="searchInput" placeholder="Search company, position, skills..." autocomplete="off">
                <span id="searchCount" class="search-count"></span>
            </div>
            <div class="header-stats" id="statsBar" style="display:none;">
                <div class="stat-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    <span id="totalJobs">0</span>
                </div>
                <div class="stat-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    <span id="totalDates">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Tabs -->
    <nav class="tabs-container" id="tabsContainer">
        <!-- Tabs injected by JS -->
    </nav>

    <!-- Loader -->
    <div class="loader-container" id="loader">
        <div class="loader-spinner"></div>
        <p>Loading jobs...</p>
    </div>

    <!-- Empty state -->
    <div class="empty-state" id="emptyState" style="display:none;">
        <div class="empty-icon">📭</div>
        <h2>No jobs found</h2>
        <p id="emptyMessage">No applied jobs data in this folder yet.</p>
    </div>

    <!-- Jobs container -->
    <main class="jobs-container" id="jobsContainer" style="display:none;">
        <!-- Date groups and job cards injected by JS -->
    </main>

    <!-- Pagination -->
    <div class="pagination-wrapper" id="paginationWrapper">
        <div class="pagination-controls" id="paginationContainer"></div>
        <div class="page-size-wrapper">
            <label for="pageSizeSelect">Per page:</label>
            <select id="pageSizeSelect" class="page-size-select">
                <option value="20" selected>20</option>
                <option value="30">30</option>
                <option value="50">50</option>
                <option value="60">60</option>
                <option value="100">100</option>
            </select>
        </div>
    </div>

    <script src="applied_jobs_view.js"></script>
</body>
</html>
